<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>מאגר הידע</title>

  <!-- צבע פס הסטטוס בטלפון, כדי שהמסך ייראה רציף -->
  <meta name="theme-color" content="#10262E">

  <!-- הקובץ שמאפשר "הוסף למסך הבית" -->
  <link rel="manifest" href="/manifest.webmanifest">

  <link rel="icon" href="/icon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!-- גופנים: נטענים ברקע (media=print ואז all), כך שהמסך מצויר מיד
       בגופן של המערכת ומתחלף כשהם מגיעים. בלי רשת — פשוט לא מגיעים. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" media="print" onload="this.media='all'">

  <!-- אייפון מתעלם מה-manifest וצריך את אלה בנפרד -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="מאגר הידע">
  <script type="module" crossorigin src="/assets/index-BYUtyNCq.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-C5QIuQIM.css">
</head>
<body>
  <!-- React ממלא את ה-div הזה. זה כל מה שיש בקובץ ה-HTML. -->
  <div id="root"></div>
</body>
</html>
